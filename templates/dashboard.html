<!DOCTYPE html>
<html>
<head><title>Dashboard</title></head>
<body>
    <h2>Health Monitor Dashboard</h2>
    <form method="POST">
        Age: <input type="number" name="age"><br>
        Heart Rate: <input type="number" name="heart_rate"><br>
        Blood Pressure: <input type="number" name="bp"><br>
        Glucose Level: <input type="number" name="glucose"><br>
        BMI: <input type="number" step="0.1" name="bmi"><br>
        Oxygen Saturation: <input type="number" name="oxygen"><br>
        Gender:
        <select name="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select><br>
        <input type="submit" value="Predict">
    </form>

    {% if prediction is not none %}
        <h3>Prediction: {{ category }}</h3>
    {% endif %}

    <a href="{{ url_for('logout') }}">Logout</a>
</body>
</html>
